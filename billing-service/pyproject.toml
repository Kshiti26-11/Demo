[project]
name = "billing-service"
version = "1.0.0"
description = "Downstream Billing service (contract consumer) for the SyncSnitch demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "grpcio>=1.84",
  "protobuf>=7.35.1,<8",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "grpcio-tools>=1.84",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the SyncSnitch verification containers"]
