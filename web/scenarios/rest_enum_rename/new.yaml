openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: >-
    Internal REST contract owned by orders-service (upstream). Consumed by
    billing-service (downstream). Reference copy for SyncSnitch - do not edit.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      operationId: health
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value:
                    status: ok
  /orders:
    get:
      operationId: listOrders
      summary: List all orders
      responses:
        "200":
          description: All orders, sorted by order_id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
              examples:
                all:
                  value:
                    - order_id: o-1001
                      customer_name: Ada Lovelace
                      total_price: 19.99
                      status: PAID
                      created_at: "2026-09-01T10:00:00Z"
                    - order_id: o-1002
                      customer_name: Alan Turing
                      total_price: 5.0
                      status: AWAITING_PAYMENT
                      created_at: "2026-09-02T11:00:00Z"
                    - order_id: o-1003
                      customer_name: Grace Hopper
                      total_price: 120.5
                      status: SHIPPED
                      created_at: "2026-09-03T12:00:00Z"
                    - order_id: o-1004
                      customer_name: Edsger Dijkstra
                      total_price: 42.0
                      status: CANCELLED
                      created_at: "2026-09-04T13:00:00Z"
  /orders/{order_id}:
    get:
      operationId: getOrder
      summary: Get one order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^o-[0-9]{4}$"
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                paid:
                  value:
                    order_id: o-1001
                    customer_name: Ada Lovelace
                    total_price: 19.99
                    status: PAID
                    created_at: "2026-09-01T10:00:00Z"
                unpaid:
                  value:
                    order_id: o-1002
                    customer_name: Alan Turing
                    total_price: 5.0
                    status: AWAITING_PAYMENT
                    created_at: "2026-09-02T11:00:00Z"
        "404":
          description: Unknown order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  value:
                    detail: order not found
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    OrderStatus:
      type: string
      enum: [AWAITING_PAYMENT, PAID, SHIPPED, CANCELLED]
    Order:
      type: object
      additionalProperties: false
      required: [order_id, customer_name, total_price, status, created_at]
      properties:
        order_id:
          type: string
          pattern: "^o-[0-9]{4}$"
        customer_name:
          type: string
          minLength: 1
        total_price:
          type: number
          minimum: 0
          description: Order total in major currency units (USD), e.g. 19.99
        status:
          $ref: "#/components/schemas/OrderStatus"
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
